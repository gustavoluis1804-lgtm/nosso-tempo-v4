name: Gerar APK - Nosso Tempo

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Mostrar versões
        run: |
          node --version
          npm --version
          java -version

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Aplicar configurações do Nosso Tempo
        run: node scripts/patch-android.mjs

      - name: Dar permissão ao Gradle
        run: chmod +x android/gradlew

      - name: Mostrar versão do Gradle
        working-directory: android
        run: ./gradlew --version

      - name: Limpar projeto
        working-directory: android
        run: ./gradlew clean

      - name: Gerar APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Nosso-Tempo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
